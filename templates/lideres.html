<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huella Solidaria — Nuestros Líderes</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/lideres.css') }}">
</head>
<body>
<div class="dash">
  {% include 'sidebar.html' %}

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h2>Nuestros Líderes</h2>
        <p>Vista de Capital Humano</p>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14" style="color:#888780;flex-shrink:0;">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
          </svg>
          <input type="text" id="searchLideres" placeholder="Buscar por nombre o proyecto" />
        </div>
      </div>
    </div>

    <div class="content">
      <div class="leaders-grid" id="lideresGrid">
        <p style="color:#888780;font-size:14px;">Cargando líderes...</p>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
<script src="{{ url_for('static', filename='js/lideres.js') }}"></script>
</body>
</html>
