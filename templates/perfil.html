<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huella Solidaria — Mi perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
  <style>
    .perfil-card{background:#fff;border-radius:12px;padding:28px;box-shadow:0 2px 8px rgba(0,0,0,.05);max-width:520px;border:1px solid #f1f5f9;}
    .avatar-grande{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #e2e8f0;}
    .avatar-initials{width:96px;height:96px;border-radius:50%;background:#EF9F27;color:#fff;font-size:32px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .perfil-header{display:flex;align-items:center;gap:20px;margin-bottom:24px;}
    .perfil-nombre{font-size:20px;font-weight:600;color:#2C2C2A;}
    .perfil-email{font-size:13px;color:#888780;margin-top:2px;}
    .perfil-rol{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:#E6F1FB;color:#185FA5;display:inline-block;margin-top:6px;}
    .form-group{margin-bottom:20px;}
    .form-label{display:block;font-size:14px;font-weight:600;color:#413434;margin-bottom:8px;}
    .form-input{width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:14px;box-sizing:border-box;}
    .form-input:focus{outline:none;border-color:#185FA5;box-shadow:0 0 0 3px rgba(24,95,165,.1);}
    .form-input:disabled{background:#f8fafc;color:#888780;cursor:default;}
    .btn-save{background:#1D9E75;color:#fff;padding:10px 22px;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-family:inherit;font-size:14px;}
    .btn-save:hover{background:#158360;}
    .success-msg{display:none;background:#D1FAE5;color:#065F46;border-radius:8px;padding:10px 14px;font-size:14px;margin-top:12px;}
    .foto-preview-wrap{position:relative;display:inline-block;margin-bottom:12px;}
    .foto-label{position:absolute;bottom:0;right:0;background:#185FA5;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;}
    #fotoInput{display:none;}
  </style>
</head>
<body>
<div class="dash">
  {% include 'sidebar.html' %}

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h2>Mi perfil</h2>
        <p>Actualiza tu foto y datos de contacto</p>
      </div>
    </div>

    <div class="content">
      <div class="perfil-card">

        <div class="perfil-header">
          <div class="foto-preview-wrap">
            <img id="fotoPreview" src="" alt="Foto de perfil"
                 class="avatar-grande" style="display:none;">
            <div id="fotoInitials" class="avatar-initials" id="userAvatar">??</div>
            <label class="foto-label" for="fotoInput" title="Cambiar foto">✏</label>
          </div>
          <div>
            <div class="perfil-nombre" id="perfilNombre">—</div>
            <div class="perfil-email" id="perfilEmail">—</div>
            <span class="perfil-rol" id="perfilRol">—</span>
          </div>
        </div>

        <input type="file" id="fotoInput" accept="image/*" onchange="seleccionarFoto(this)">

        <div class="form-group">
          <label class="form-label">Nombre completo</label>
          <input type="text" id="nombre" class="form-input" disabled>
        </div>

        <div class="form-group">
          <label class="form-label">Matrícula</label>
          <input type="text" id="matricula" class="form-input" placeholder="Ej. A01234567">
        </div>

        <button class="btn-save" onclick="guardarPerfil()">Guardar cambios</button>
        <div class="success-msg" id="successMsg">¡Perfil actualizado correctamente!</div>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
<script>
let fotoNueva = null;

async function cargarPerfil() {
  const res  = await fetch('/api/me');
  const user = await res.json();

  document.getElementById('perfilNombre').textContent = user.nombre;
  document.getElementById('perfilEmail').textContent  = user.email;
  document.getElementById('perfilRol').textContent    = user.rol === 'admin' ? 'Administrador' : 'Líder';
  document.getElementById('nombre').value             = user.nombre;
  document.getElementById('matricula').value          = user.matricula || '';

  const initials = document.getElementById('fotoInitials');
  const imgEl    = document.getElementById('fotoPreview');

  if (user.foto_url) {
    imgEl.src          = user.foto_url;
    imgEl.style.display = 'block';
    initials.style.display = 'none';
  } else {
    initials.textContent   = user.initials;
    initials.style.display = 'flex';
    imgEl.style.display    = 'none';
  }
}

function seleccionarFoto(input) {
  if (!input.files || !input.files[0]) return;
  fotoNueva = input.files[0];
  const imgEl   = document.getElementById('fotoPreview');
  const initials = document.getElementById('fotoInitials');
  imgEl.src          = URL.createObjectURL(fotoNueva);
  imgEl.style.display = 'block';
  initials.style.display = 'none';
}

async function guardarPerfil() {
  const msg = document.getElementById('successMsg');
  msg.style.display = 'none';

  let foto_url = null;
  if (fotoNueva) {
    const fd = new FormData();
    fd.append('foto', fotoNueva);
    const upRes  = await fetch('/api/upload-foto', { method: 'POST', body: fd });
    const upData = await upRes.json();
    foto_url = upData.url;
  }

  const payload = { matricula: document.getElementById('matricula').value };
  if (foto_url) payload.foto_url = foto_url;

  try {
    const res = await fetch('/api/perfil', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    if (res.ok) {
      msg.style.display = 'block';
      fotoNueva = null;
      setTimeout(() => msg.style.display = 'none', 3000);
    }
  } catch {
    alert('Error al guardar. Intenta de nuevo.');
  }
}

cargarPerfil();
</script>
</body>
</html>
